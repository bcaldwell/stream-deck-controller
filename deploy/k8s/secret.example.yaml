# Example only - do not commit a real token. Create the real one with:
#   kubectl -n stream-deck create secret generic sdc-secrets --from-literal=HA_TOKEN=<long-lived-token> \
#     --from-literal=SDC_CLIENT_TOKEN=$(openssl rand -hex 32) \
#     --from-literal=SDC_ASSETS_S3_ACCESS_KEY_ID=<key> --from-literal=SDC_ASSETS_S3_SECRET_ACCESS_KEY=<secret>
apiVersion: v1
kind: Secret
metadata:
  name: sdc-secrets
type: Opaque
stringData:
  HA_TOKEN: "changeme"
  SDC_CLIENT_TOKEN: "changeme"          # shared with every client
  SDC_ASSETS_S3_ACCESS_KEY_ID: "changeme"
  SDC_ASSETS_S3_SECRET_ACCESS_KEY: "changeme"
